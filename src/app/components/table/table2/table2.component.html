<hr>

<div class="container">
    <div class="row">
        <div class="col-md-6">
            <table class="table table-bordered">
                <thead class="bg-dark text-white text-center p-2"> 
                    <tr>
                        <th>sr.no.</th>
                        <th>Id</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>isAvailable</th>
                        <th>Brand</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let pro of Product , let i = index">
                        <td>{{i+1}}</td>
                        <td>{{pro.prodId}}</td>
                        <td>{{pro.prodName}}</td>
                        <td>{{pro.category}}</td>
                        <td>{{pro.price}}</td>
                        <td>{{pro.stock}}</td>
                        <td>{{pro.isAvailable}}</td>
                        <td>{{pro.brand}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
